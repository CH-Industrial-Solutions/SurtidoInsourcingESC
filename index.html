<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QORVEX | Surtido</title>
<style>:root{--navy:#0b1a33;--blue:#1d6fe0;--cyan:#06b6d4;--blue2:#e4efff;--green:#16a34a;--green2:#e3f7ec;--orange:#f59e0b;--orange2:#fff1dc;--red:#e5484d;--red2:#ffe6e7;--purple:#7c5cd6;--purple2:#eee9ff;--ink:#0f1e3d;--mut:#64748b;--line:#dde4ee;--bg:#eef2f7;--card:#fff;--gr:linear-gradient(90deg,#06b6d4,#1d6fe0)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font:14px/1.4 Inter,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}.hidden{display:none!important}
/* acceso */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--wall) center/cover no-repeat #1d5fb0}
.gate-card{background:#fff;border-radius:16px;padding:30px;width:min(440px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.gate-card h1{font-size:22px}.gate-card h1 span{color:var(--cyan)}.gate-card p{color:var(--mut);margin:6px 0 16px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.logo{width:46px;height:46px;border-radius:10px;background:var(--navy);color:#fff;font-weight:800;font-size:20px;display:flex;align-items:center;justify-content:center;letter-spacing:-1px;flex:none}
.logoimg{max-height:64px;max-width:190px;display:block;background:#fff;border-radius:10px;padding:4px}
.brand small{display:block;color:var(--mut);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
label.f{display:block;margin:10px 0 0;font-size:12px;font-weight:600;color:var(--mut)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px}
input,select,textarea{border:1px solid #cfd8e5;border-radius:8px;padding:8px 10px;background:#fff;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #9bd8ea;border-color:var(--cyan)}
.btn{border:1px solid #cfd8e5;background:#fff;border-radius:9px;padding:8px 15px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:13.5px;display:inline-block}
.btn:hover{background:#f3f7fc}.btn.p{background:var(--gr);border-color:transparent;color:#fff}.btn.p:hover{filter:brightness(1.06);background:var(--gr)}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}.btn.d{background:var(--red);border-color:var(--red);color:#fff}
.btn.n{background:var(--navy);border-color:var(--navy);color:#fff}.btn.s{padding:4px 9px;font-size:12px}.btn.take{background:#fbbf24;color:#3b2a00;border-color:#fbbf24}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.right{margin-left:auto}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
/* estructura: menú lateral + contenido a todo el ancho */
.shell{display:flex;height:100vh;overflow:hidden}
.side{width:232px;flex:none;background:var(--navy);color:#c9d6ea;display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto}
.sidelogo{min-height:56px;display:flex;align-items:center;gap:10px;padding:0 6px;color:#fff;font-size:11px;letter-spacing:.08em;font-weight:700}
.sidelogo{justify-content:center}.sidelogo .logoimg{max-height:78px;padding:6px 10px}
.prod{margin:14px 6px 8px;font-size:19px;font-weight:800;color:#fff}.prod span{color:#22c1dc}.prod small{display:block;font-size:10.5px;font-weight:500;color:#8fa6cc;letter-spacing:.04em;margin-top:3px}
.sec{font-size:10.5px;letter-spacing:.14em;color:#6f87ad;margin:14px 12px 5px;font-weight:700}
.nv{border:0;background:transparent;color:#c9d6ea;text-align:left;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:600;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;width:100%}
.nv:hover{background:#13274a}.nv.on{background:var(--gr);color:#fff}.nv b{background:rgba(255,255,255,.16);border-radius:999px;padding:0 8px;font-size:12px}
.usr{margin-top:auto;border-top:1px solid #1f3357;padding:14px 8px 0;font-size:13px}.usr b{color:#fff;display:block}
.usr .out{margin-top:10px;border:1px solid #33496f;background:transparent;color:#c9d6ea;border-radius:8px;padding:7px;text-align:center;font-weight:600;width:100%;cursor:pointer}.usr .out:hover{background:#13274a}.usr .tema{display:flex;align-items:center;justify-content:center;gap:8px}.usr .tema i,.usr .tema em{font-style:normal}.side.mini .usr .tema em{display:none}.side.mini .usr .tema::before{content:none!important}.side.mini .usr .tema{font-size:15px!important}
.mainc{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
header.top{min-height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:16px;padding:8px 28px;flex:none;flex-wrap:wrap}
header.top h1{font-size:21px;font-weight:800}header.top .d{font-size:13px;color:var(--mut)}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;background:var(--green2);color:#0f7a3d}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}.pill.ro{background:var(--orange2);color:#9a5b00}
.cinta{display:flex;align-items:center;gap:10px;background:var(--green2);border:1px solid #b9e6cb;border-radius:10px;padding:6px 12px;font-size:13px;color:#0f5a2b;flex-wrap:wrap}
.cinta.falta{background:var(--red2);border-color:#f5b5b8;color:#8f1d22}.cinta select{min-width:200px;padding:6px 10px;font-weight:600}
main{flex:1;overflow:auto;padding:22px 28px 60px}
@media(min-width:2200px){.mainc{zoom:1.15}}@media(min-width:2900px){.mainc{zoom:1.4}}
@media(max-width:1000px){.side{width:74px;padding:14px 8px}.side .prod,.side .sec,.sidelogo span,.usr b,.usr span{display:none}.nv{font-size:11px;padding:9px 4px;justify-content:center;text-align:center}.nv b{display:none}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.card>h3{font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card>h3 .tag,.card>h3 .btn,.card>h3 input,.card>h3 select{letter-spacing:0;text-transform:none}
.grid{display:grid;gap:18px;margin-bottom:18px}.grid>.card,.grid>.kpi{margin-bottom:0}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
@media(max-width:1100px){.g2,.g3,.g4,.g5,.g21{grid-template-columns:1fr}}
.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--cyan);border-radius:12px;padding:16px 20px}
.kpi span{font-weight:700;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.kpi b{display:block;font-size:38px;line-height:1.1;font-weight:800;margin-top:4px}.kpi small{display:block;font-size:12.5px;color:var(--mut);margin-top:2px}
.kpi.b,.kpi.sb{border-left-color:var(--blue)}.kpi.g,.kpi.sg{border-left-color:var(--green)}.kpi.o{border-left-color:var(--orange)}.kpi.r{border-left-color:var(--cyan)}.kpi.v,.kpi.sv{border-left-color:var(--purple)}
.hbig{font-size:38px;font-weight:800;line-height:1.15;margin-top:4px}.hbig small{font-size:15px;font-weight:500;color:var(--mut)}
.tw{overflow:auto;max-height:62vh;border:1px solid var(--line);border-radius:10px}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:#f4f7fb;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
table.t td{padding:8px 10px;border-bottom:1px solid #edf1f6;vertical-align:middle}
table.t tr:hover td{background:#f8fafd}table.t td.b{white-space:nowrap}table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.bad td{background:#fff5f5}tr.dup td{background:#fffaf0;color:#8a6d1a}tr.corto td{background:#fff1f1}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.tag.b{background:var(--blue2);color:#1553b8}.tag.g{background:var(--green2);color:#0f7a3d}.tag.o{background:var(--orange2);color:#9a5b00}.tag.r{background:var(--red2);color:#b3232a}.tag.v{background:var(--purple2);color:#553bb0}.tag.k{background:#e9eef5;color:#475569}
.drop{border:2px dashed #a9bbd6;border-radius:12px;padding:28px;text-align:center;color:var(--mut);background:#f7faff}
.drop b{color:var(--ink);font-size:20px;display:block;margin-bottom:4px}
.bar{height:10px;background:#e6ecf4;border-radius:8px;position:relative;min-width:70px}.bar i{display:block;height:100%;background:var(--gr);border-radius:8px;max-width:100%}.bar i.g{background:#1faa59}.bar i.o{background:var(--orange)}.bar i.r{background:var(--red)}
.bar.lg{height:12px;margin:10px 0 6px}.bar u{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
.hb{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;align-items:center;gap:12px;font-size:13px;margin-top:10px}.hb b{font-weight:800;min-width:54px;text-align:right}.hb span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-top:22px}.lbl:first-child{margin-top:0}
.note{background:var(--orange2);border:1px solid #f6d59a;border-radius:10px;padding:10px 14px;color:#7a4b00;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note.ro{background:#fff7d6}.note.i{background:var(--blue2);border-color:#bcd6ff;color:#0f3f8f}
.mut{color:var(--mut)}.sm{font-size:12.5px}.b{font-weight:700}
.legend{display:grid;gap:6px;font-size:13px}.legend span{display:flex;align-items:center;gap:8px}.legend i{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}.legend em{margin-left:auto;font-style:normal;font-variant-numeric:tabular-nums}
/* modal */
.modal{position:fixed;inset:0;background:rgba(7,18,42,.6);display:flex;align-items:flex-start;justify-content:center;padding:4vh 14px;z-index:50;overflow:auto}
.modal>div{background:#fff;border-radius:14px;padding:22px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal>div.wide{width:min(1100px,100%)}
.modal h3{font-size:17px;margin-bottom:6px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:10px;z-index:99;max-width:90vw;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#toast.e{background:#b3232a}
/* interacción y movimiento */
.ic{width:19px;height:19px;flex:none}
.nv{justify-content:flex-start;gap:11px}.nv .nl{flex:1}
.colap{align-self:flex-end;border:0;background:transparent;color:#8fa6cc;cursor:pointer;padding:4px;border-radius:6px;margin:-6px -2px 4px}.colap:hover{background:#13274a;color:#fff}
.side{transition:width .2s ease}.side.mini{width:70px;padding:18px 10px}.side.mini .prod,.side.mini .sec,.side.mini .nl,.side.mini .nv b,.side.mini .sidelogo span,.side.mini .usr b,.side.mini .usr span{display:none}
.side.mini .nv{justify-content:center;padding:11px 0}.side.mini .colap{align-self:center}.side.mini .sidelogo{justify-content:center;padding:0}.side.mini .logoimg{max-width:48px;max-height:48px;padding:3px}.side.mini .usr .out{font-size:0;padding:9px 0}.side.mini .usr .out::before{content:"⏻";font-size:15px}
.btn,.nv,.kpi,.card,.hb,table.t td{transition:background-color .15s,box-shadow .15s,transform .15s,border-color .15s,filter .15s}
.btn:active{transform:scale(.97)}
table.t th{cursor:pointer;user-select:none}table.t th:hover{color:var(--ink)}table.t th[data-s=a]::after{content:" ▲";color:var(--blue)}table.t th[data-s=d]::after{content:" ▼";color:var(--blue)}
[data-a=drill]{cursor:pointer}.kpi[data-a=drill]:hover{box-shadow:0 8px 22px rgba(11,26,51,.13);transform:translateY(-2px)}
tr[data-a=drill]:hover td{background:#eaf4ff}.hb[data-a=drill]{border-radius:6px;padding:3px 4px;margin-left:-4px;margin-right:-4px}.hb[data-a=drill]:hover{background:#eef4fb}
svg.ch [data-tip]{transition:opacity .15s}svg.ch [data-tip]:hover{opacity:.75}
#tip{position:fixed;z-index:120;background:var(--navy);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:7px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:320px;display:none}
.dlg{position:fixed;inset:0;background:rgba(7,18,42,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:110}
.dbox{background:#fff;border-radius:14px;padding:24px;width:min(460px,100%);box-shadow:0 24px 70px rgba(0,0,0,.4);animation:sube .2s ease-out both}.dbox h3{font-size:18px;margin-bottom:8px}.dbox p{margin:0 0 12px;color:#334155;line-height:1.45}
.prog{height:6px;background:#e6ecf4;border-radius:6px;overflow:hidden;margin-top:14px}.prog i{display:block;height:100%;width:40%;background:var(--gr);border-radius:6px;animation:corre 1.1s ease-in-out infinite}
.modal>div{animation:sube .2s ease-out both}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes creceX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes creceY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes corre{0%{transform:translateX(-110%)}100%{transform:translateX(270%)}}
.enter .card,.enter .kpi,.enter .note{animation:sube .32s ease-out both}
.enter .grid>:nth-child(2){animation-delay:.04s}.enter .grid>:nth-child(3){animation-delay:.08s}.enter .grid>:nth-child(4){animation-delay:.12s}.enter .grid>:nth-child(5){animation-delay:.16s}
.enter .bar i{transform-origin:left center;animation:creceX .6s cubic-bezier(.2,.7,.2,1) .1s both}
.enter svg.ch rect{transform-box:fill-box;transform-origin:center bottom;animation:creceY .55s cubic-bezier(.2,.7,.2,1) .1s both}
.enter svg.ch circle,.enter svg.ch polyline,.enter svg.ch polygon{animation:sube .5s ease-out .1s both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
/* vista previa */
.pv{background:#5b6577;padding:16px;border-radius:10px;max-height:70vh;overflow:auto;display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.pv .label,.pv .sheet{box-shadow:0 4px 18px rgba(0,0,0,.4)}
.pv .label{zoom:.62}.pv .sheet{zoom:.62}
/* etiqueta 4x6 · opción A · margen 8 mm */
.label{width:4in;height:6in;background:#fff;color:#000;padding:8mm;display:flex;flex-direction:column;font-family:Arial,Helvetica,sans-serif;overflow:hidden;position:relative}
.label .l1{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #000;padding-bottom:3px}
.label .lin{font-size:22pt;font-weight:900;line-height:1}.label .fol{font-size:16.5pt;font-weight:900;line-height:1;text-align:right}
.label .l2{display:flex;justify-content:space-between;font-size:7pt;margin-top:2px}.label .l2 b{border:1px solid #000;padding:0 3px}
.label .ban{background:#000;color:#fff;text-align:center;font-weight:900;font-size:10pt;padding:1px;margin-top:3px;letter-spacing:.04em}
.label .qr{display:grid;grid-template-columns:.78in 1fr;gap:.12in;align-items:center;border-bottom:1px solid #000;padding:4px 0}
.label .qr svg,.label .qr .noqr{width:.78in;height:.78in;display:block}.label .qr .noqr{border:1px dashed #000}
.label .qr>div{min-width:0}.label .qr u{display:block;text-decoration:none;font-size:6.5pt;font-weight:700;letter-spacing:.06em}
.label .qr b{display:block;font-size:16.5pt;line-height:1.05;white-space:nowrap;overflow:hidden}.label .qr small{display:block;font-size:7pt;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.label .box{display:grid;grid-template-columns:1.2fr 1fr;border:2px solid #000;margin-top:6px}
.label .box>div{padding:2px 6px}.label .box>div+div{border-left:2px solid #000}
.label .box u{display:block;text-decoration:none;font-size:6.5pt;font-weight:700;letter-spacing:.06em}.label .qty{font-size:30pt;font-weight:900;line-height:.95}.label .hr{font-size:19pt;font-weight:900;line-height:1}
.label .ft{margin-top:auto;font-size:6.5pt;display:grid;grid-template-columns:1fr 1fr;gap:0 8px;border-top:1px solid #000;padding-top:2px}.label .ft span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* hoja de surtido (carta horizontal, filas de alto fijo, sin salto de línea) */
.sheet{width:10.6in;height:8.1in;background:#fff;color:#000;padding:.08in .1in;font-family:Arial,Helvetica,sans-serif;font-size:9pt;overflow:hidden;display:flex;flex-direction:column}
.sheet .sh{display:grid;grid-template-columns:3.1in 1fr 3.1in;align-items:center;border-bottom:3px solid #000;padding-bottom:4px;height:.78in;flex:none}
.sheet .sh .lg{display:flex;align-items:center;gap:.18in;height:.68in}.sheet .sh .lg img{max-height:.66in;max-width:1.4in;display:block}
.sheet .sh h2{font-size:21pt;line-height:1.05;text-align:center;white-space:nowrap}.sheet .sh h2 small{display:block;font-size:9pt;font-weight:400}
.sheet .sh .fo{text-align:right;font-size:9pt;line-height:1.25;white-space:nowrap}.sheet .sh .fo b{font-size:12pt}.sheet .sh .fo .pg{font-size:12pt;font-weight:700}
.sheet .who{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 14px;margin:4px 0;font-size:9.5pt;flex:none;white-space:nowrap;overflow:hidden}
.sheet table{border-collapse:collapse;width:100%;table-layout:fixed;flex:none}
.sheet th,.sheet td{border:1px solid #000;padding:0 4px;height:var(--rh,.25in);font-size:9.5pt;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet th{background:#e5e5e5;font-size:8.5pt;height:.24in}.sheet td.c{text-align:center}.sheet td.q{font-weight:700;text-align:right}.sheet td.sin{font-weight:700;background:#ddd}
.sheet .sg{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:.4in;font-size:8.5pt;text-align:center;flex:none}.sheet .sg div{border-top:1px solid #000;padding-top:2px}
#print-root{display:none}
@media print{
  body{background:#fff}body>*:not(#print-root){display:none!important}
  #print-root{display:block}
  #print-root .label{height:5.94in}
  #print-root .label,#print-root .sheet{break-after:page;page-break-after:always;box-shadow:none}
  #print-root .label:last-child,#print-root .sheet:last-child{break-after:auto;page-break-after:auto}
}


table.seg td{padding:3px 8px;white-space:nowrap;font-size:12.5px;line-height:1.2}table.seg th{padding:6px 8px}table.seg td.d{max-width:180px;overflow:hidden;text-overflow:ellipsis}table.seg .btn.s{padding:3px 8px;font-size:11.5px}table.seg .tag{padding:1px 6px;font-size:11px}table.seg .selm{padding:2px 6px;font-size:12px;border-radius:6px;max-width:170px}#seg-tw td:last-child{position:sticky;right:0;background:var(--card);box-shadow:-8px 0 10px -8px rgba(0,0,0,.25)}
.brand .logoimg{max-height:86px;max-width:150px}
/* ===== tema oscuro (la impresión de etiquetas y hojas siempre sale en blanco) ===== */
html[data-theme=dark]{--bg:#0a0e17;--card:#131a27;--ink:#e6edf7;--mut:#93a4bd;--line:#243044;--blue2:#11264a;--green2:#0f2e20;--orange2:#3a2a0c;--red2:#3a1518;--purple2:#261f47;color-scheme:dark}
[data-theme=dark] .gate{background:linear-gradient(rgba(5,8,14,.74),rgba(5,8,14,.74)),var(--wall) center/cover no-repeat #05080e}
[data-theme=dark] .side{background:#060a12;border-right:1px solid #1a2436}
[data-theme=dark] header.top,[data-theme=dark] .kpi,[data-theme=dark] .modal>div,[data-theme=dark] .dbox,[data-theme=dark] .gate-card{background:var(--card);color:var(--ink)}
[data-theme=dark] .dbox p{color:#c3cfdf}[data-theme=dark] .gate-card h1{color:var(--ink)}
[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea{background:#0d131e;border-color:#2c3a52;color:var(--ink)}

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }

<script>/* ===== QORVEX Surtido · Motor (funciones puras) ===== */
const QS = (() => {
  const norm = s => String(s == null ? '' : s).replace(/[ \t\r\n]+/g, ' ').trim();
  const key = s => norm(s).toUpperCase().replace(/\s+/g, '');
  const pad = (n, l = 2) => String(n).padStart(l, '0');
  const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  const hm = d => pad(d.getHours()) + ':' + pad(d.getMinutes());
  const toMin = t => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ''); return m ? (+m[1]) * 60 + (+m[2]) : 0; };

  /* ---------- Lector XLSX mínimo (zip + xml), sin dependencias ---------- */
  async function inflate(u8) {
    const ds = new DecompressionStream('deflate-raw');
    const buf = await new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer();
    return new Uint8Array(buf);
  }
  async function unzip(ab, wanted) {
    const u8 = new Uint8Array(ab), dv = new DataView(ab);
    let e = u8.length - 22;
    while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error('El archivo no es un Excel .xlsx válido');
    const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true);
    const out = {}, td = new TextDecoder();
    for (let i = 0; i < n; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true), csize = dv.getUint32(p + 20, true);
      const nl = dv.getUint16(p + 28, true), el = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true);
      const off = dv.getUint32(p + 42, true);
      const name = td.decode(u8.subarray(p + 46, p + 46 + nl));
      if (wanted(name)) {
        const lnl = dv.getUint16(off + 26, true), lel = dv.getUint16(off + 28, true);
        const data = u8.subarray(off + 30 + lnl + lel, off + 30 + lnl + lel + csize);
        out[name] = td.decode(method === 0 ? data : await inflate(data));
      }
      p += 46 + nl + el + cl;
    }
    return out;
  }
  const xmlDec = s => s.indexOf('&') < 0 ? s : s.replace(/&(#x?[0-9a-fA-F]+|amp|lt|gt|quot|apos);/g, (m, c) =>
    c === 'amp' ? '&' : c === 'lt' ? '<' : c === 'gt' ? '>' : c === 'quot' ? '"' : c === 'apos' ? "'" :
      String.fromCodePoint(c[1] === 'x' ? parseInt(c.slice(2), 16) : parseInt(c.slice(1), 10)));
  const colIdx = ref => { let n = 0; for (let i = 0; i < ref.length; i++) { const c = ref.charCodeAt(i); if (c < 65 || c > 90) break; n = n * 26 + (c - 64); } return n - 1; };
  async function readXlsx(ab) {
    const files = await unzip(ab, n => /^xl\/(workbook\.xml|_rels\/workbook\.xml\.rels|sharedStrings\.xml|worksheets\/[^/]+\.xml)$/.test(n));
    let sheetPath = null;
    const wb = files['xl/workbook.xml'], rels = files['xl/_rels/workbook.xml.rels'];
    if (wb && rels) {
      const m = /<sheet\b[^>]*?r:id="([^"]+)"/.exec(wb);
      if (m) {
        const re = /<Relationship\b[^>]*>/g; let r;
        while ((r = re.exec(rels))) {
          if (new RegExp('Id="' + m[1] + '"').test(r[0])) {
            const t = /Target="([^"]+)"/.exec(r[0]);
            if (t) sheetPath = t[1].startsWith('/') ? t[1].slice(1) : 'xl/' + t[1];
          }
        }
      }
    }
    if (!sheetPath || !files[sheetPath]) sheetPath = Object.keys(files).filter(n => n.includes('worksheets/')).sort()[0];
    if (!sheetPath) throw new Error('No se encontró ninguna hoja en el archivo');
    const ss = [];
    if (files['xl/sharedStrings.xml']) {
      const reSi = /<si>([\s\S]*?)<\/si>|<si\/>/g; let m;
      while ((m = reSi.exec(files['xl/sharedStrings.xml']))) {
        let body = (m[1] || '').replace(/<rPh[\s\S]*?<\/rPh>/g, ''), t = '', mt; const reT = /<t\b[^>]*>([\s\S]*?)<\/t>/g;
        while ((mt = reT.exec(body))) t += mt[1];
        ss.push(xmlDec(t));
      }
    }
    const xml = files[sheetPath], rows = [];
    const reRow = /<row\b[^>]*>([\s\S]*?)<\/row>/g, reC = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g; let mr;
    while ((mr = reRow.exec(xml))) {
      const row = []; let mc; reC.lastIndex = 0;

        }
        row[ci] = v;
      }
      for (let i = 0; i < row.length; i++) if (row[i] === undefined) row[i] = null;
      rows.push(row);
    }
    return rows;
  }
  function parseDelim(text) {
    const lines = text.replace(/\r\n?/g, '\n').split('\n').filter(l => l.trim() !== '');
    const d = lines.length && lines[0].includes('\t') ? '\t' : ',';
    return lines.map(l => l.split(d).map(c => c.replace(/^"|"$/g, '')));
  }

  /* ---------- Inventarios ---------- */
  function parseInventario(rows, tipo) {
    if (!rows.length) throw new Error('El archivo está vacío');
    const h = rows[0].map(c => key(c).toLowerCase());
    const find = (...tests) => { for (const t of tests) { const i = h.findIndex(x => typeof t === 'string' ? x === t : t.test(x)); if (i >= 0) return i; } return -1; };
    let cW, cI, cL, cQ, cD;

      cW = find('warehouse'); cD = find('description'); cI = find(/^itemcode/); cL = find('location'); cQ = find(/^inventory/);
      if (cI < 0 || cL < 0 || cQ < 0) { cW = 0; cD = 1; cI = 3; cL = 4; cQ = 5; }

    }

    for (let i = 1; i < rows.length; i++) {

    }
    if (!out.length) throw new Error('No se reconocieron renglones de inventario ' + tipo + '. Revisa que sea el reporte correcto.');
    return { rows: out, omitidos: omit };
  }

  /* ---------- Pegado desde Smartsheet ---------- */
  const CAMPOS = ['created', 'modified', 'almacen', 'linea', 'router', 'item', 'desc', 'prioridad', 'qty', 'solicitante', 'supCliente', 'comentarios'];
  const HEAD = { created: /^created|^creado/, modified: /^modifi/, almacen: /^almac/, linea: /^line/, router: /^router/, item: /^item/, desc: /^desc|^dcs/, prioridad: /^priori|^impacto|^hora/, qty: /^quant|^cant/, solicitante: /^request|^solicit/, supCliente: /^superv/, comentarios: /^comment|^coment/ };
  function parsePaste(text) {
    const lines = text.replace(/\r\n?/g, '\n').split('\n').filter(l => l.replace(/\t/g, '').trim() !== '');
    if (!lines.length) return { rows: [], error: 'No hay datos en el portapapeles.' };
    let tab = lines.map(l => l.split('\t').map(norm));
    let map = null;
    const h0 = tab[0].map(c => c.toLowerCase());
    if (h0.some(c => HEAD.almacen.test(c)) || h0.some(c => HEAD.item.test(c)) && h0.some(c => HEAD.qty.test(c))) {
      map = {}; for (const f of CAMPOS) map[f] = h0.findIndex(c => HEAD[f].test(c));
      tab = tab.slice(1);
    } else {
      // sin encabezado: ancla = columna cuyo contenido es LN / BAAN
      const nc = Math.max(...tab.map(r => r.length)); let a = -1, best = 0;
      for (let c = 0; c < nc; c++) { const k = tab.filter(r => /^(LN|BAAN)$/i.test(r[c] || '')).length; if (k > best) { best = k; a = c; } }
      if (a < 0 || best < tab.length * 0.6) return { rows: [], error: 'No reconocí la tabla. Copia las columnas completas de Smartsheet (Created … Comments), con o sin encabezado.' };
      map = { created: a - 2, modified: a - 1, almacen: a, linea: a + 1, router: a + 2, item: a + 3, desc: a + 4, prioridad: a + 5, qty: a + 6, solicitante: a + 7, supCliente: a + 8, comentarios: a + 9 };
    }
    const rows = [];
    for (const r of tab) {
      const g = f => map[f] >= 0 && map[f] < r.length ? r[map[f]] || '' : '';
      const o = { created: g('created'), modified: g('modified'), almacen: g('almacen').toUpperCase(), linea: g('linea').toUpperCase(), router: g('router').toUpperCase(), item: key(g('item')), desc: g('desc'), prioridad: g('prioridad'), qty: parseFloat(g('qty').replace(/,/g, '')), solicitante: g('solicitante'), supCliente: g('supCliente'), comentarios: g('comentarios') };
      if (!o.item && !o.linea) continue;
      rows.push(o);
    }
    return { rows };
  }
  const ALM_POR_LINEA = l => /BAAN|^DEFTANK$|^AFT$/.test(l) ? 'BAAN' : 'LN';
  function validaReq(o) {
    const e = [];
    if (!o.item) e.push('sin ítem');
    if (!(o.qty > 0)) e.push('cantidad inválida');
    if (!o.linea) e.push('sin línea');
    if (o.almacen !== 'LN' && o.almacen !== 'BAAN') { o.almacen = ALM_POR_LINEA(o.linea); }
    return e;
  }
  const claveReq = o => [o.created, o.linea, o.item, o.qty].map(x => key(x)).join('|');
  function prioMin(p) { // minutos desde 00:00 o null si es texto
    const m = /^(\d{1,2}):(\d{2})(?::\d{2})?\s*([AP])?\.?\s*M?\.?$/i.exec(norm(p));
    if (!m) return null;
    let h = +m[1]; if (m[3]) { const pm = m[3].toUpperCase() === 'P'; if (h === 12) h = pm ? 12 : 0; else if (pm) h += 12; }
    return h > 23 || +m[2] > 59 ? null : h * 60 + (+m[2]);
  }
  const prioTxt = p => { const m = prioMin(p); return m == null ? norm(p) : pad(Math.floor(m / 60)) + ':' + pad(m % 60); };

  /* ---------- Turnos ---------- */
  function turnoDe(date, turnos) {
    const m = date.getHours() * 60 + date.getMinutes();
    for (const t of turnos) {
      const a = toMin(t.inicio), b = toMin(t.fin);
      if (a < b ? (m >= a && m < b) : (m >= a || m < b)) {
        const d = new Date(date); if (a > b && m < b) d.setDate(d.getDate() - 1);
        return { turno: t, fechaOp: ymd(d) };
      }
    }
    return { turno: turnos[0], fechaOp: ymd(date) };
  }
  const horasTurno = t => { let d = toMin(t.fin) - toMin(t.inicio); if (d <= 0) d += 1440; return d / 60; };

  /* ---------- Cruce ---------- */
  function indexar(rows, prio, def) {
    const ix = new Map();
    rows.forEach((r, i) => { r._i = i; r._p = prio[r.loc] != null ? prio[r.loc] : def; let a = ix.get(r.item); if (!a) ix.set(r.item, a = []); a.push(r); });
    for (const a of ix.values()) a.sort((x, y) => x._p - y._p || x._i - y._i);
    return ix;
  }
  /* reqs: solicitudes válidas. ctx: {ln, baan (arrays, se MUTAN), prio:{ln,baan}, jaula:Set, pallets:{item:std}, grupos:{linea:grupo}} */
  function cruce(reqs, ctx) {
    const ix = { LN: indexar(ctx.ln, ctx.prio.ln, 9), BAAN: indexar(ctx.baan, ctx.prio.baan, 5) };
    const out = [];
    reqs.forEach((q, qi) => {
      const alm = q.almacen, cand = ix[alm].get(q.item) || [];
      const jaula = alm === 'LN' && ctx.jaula.has(q.item);
      const std = +ctx.pallets[q.item] || 0;
      const base = { req: qi, linea: q.linea, grupo: jaula ? 'JAULA' : (ctx.grupos[q.linea] || q.linea), almacen: alm, item: q.item, router: q.router, prioridad: prioTxt(q.prioridad), pmin: prioMin(q.prioridad), solicitante: q.solicitante, supCliente: q.supCliente, creadoSS: q.created, comSS: q.comentarios, qtySolicitada: q.qty, jaula };
      const desc = q.desc || (cand[0] && cand[0].desc) || 'Revisar Item';
      let pend = q.qty, pal = std > 0 ? Math.ceil(q.qty / std) : 0;
      for (const r of cand) {
        if (r.qty <= 0) continue;
        if (std > 0 ? pal <= 0 : pend <= 0) break;
        let tomar, k = 0;
        if (std > 0) { k = Math.min(pal, Math.ceil(r.qty / std)); tomar = Math.min(r.qty, k * std); pal -= k; }
        else { tomar = Math.min(r.qty, pend); pend -= tomar; }
        out.push({ ...base, tipo: 'TICKET', desc, wh: r.wh, loc: r.loc, stock: r.qty, qty: tomar, pallets: k, std });
        r.qty -= tomar;
      }
      const falta = std > 0 ? pal * std : pend;
      if (falta > 0) out.push({ ...base, tipo: 'CORTO', desc, wh: alm === 'BAAN' ? 'ORW' : 'ELCM01', loc: 'SIN INVENTARIO', stock: 0, qty: falta, pallets: std > 0 ? pal : 0, std });
    });
    return out;
  }
  /* orden de impresión: grupo (línea) → hora requerida relativa al inicio de turno → texto al final */
  function ordenar(res, grupoOrden, inicioTurnoMin) {
    const gi = g => { const i = grupoOrden.indexOf(g); return g === 'JAULA' ? 9999 : i < 0 ? 999 : i; };
    const rel = m => m == null ? 99999 : (m - inicioTurnoMin + 1440) % 1440;
    return res.map((r, i) => [r, i]).sort((a, b) => gi(a[0].grupo) - gi(b[0].grupo) || a[0].grupo.localeCompare(b[0].grupo) || rel(a[0].pmin) - rel(b[0].pmin) || a[1] - b[1]).map(x => x[0]);
  }

  /* ---------- TXT (TSV) ---------- */
  const san = v => String(v == null ? '' : v).replace(/[\t\r\n]+/g, ' ');
  const tsvLine = (o, cols) => cols.map(c => san(typeof o[c] === 'object' && o[c] !== null ? JSON.stringify(o[c]) : o[c])).join('\t');
  function tsvParse(text) {
    const ls = text.split('\n').filter(l => l.length); if (!ls.length) return [];
    const h = ls[0].replace(/^﻿/, '').split('\t');
    return ls.slice(1).map(l => { const c = l.split('\t'), o = {}; h.forEach((k, i) => o[k] = c[i] == null ? '' : c[i]); return o; });
  }
  return { norm, key, pad, ymd, hm, toMin, readXlsx, parseDelim, parseInventario, parsePaste, validaReq, claveReq, prioMin, prioTxt, turnoDe, horasTurno, cruce, ordenar, tsvLine, tsvParse, san };
})();
if (typeof module !== 'undefined') module.exports = QS;
</script>
<script>/* ===== QORVEX Surtido · Núcleo: carpeta, sesión, candado, datos ===== */
const VERSION = '1.6.0';

/* ---------- IndexedDB (recordar carpeta) ---------- */

/* ---------- Carpeta (File System Access) ---------- */
const FS = {
  dir: null,
  async h(name, create) { const p = name.split('/'); let d = this.dir; for (let i = 0; i < p.length - 1; i++) d = await d.getDirectoryHandle(p[i], { create }); return d.getFileHandle(p[p.length - 1], { create }); },
  async file(name) { try { return await (await this.h(name, false)).getFile(); } catch (e) { if (e.name === 'NotFoundError' || e.name === 'TypeMismatchError') return null; throw e; } },
  async read(name) { const f = await this.file(name); return f ? f.text() : null; },
  async json(name, def) { const t = await this.read(name); if (t == null || t.trim() === '') return def; try { return JSON.parse(t); } catch (e) { throw new Error('El archivo ' + name + ' está dañado: ' + e.message); } },
  async mod(name) { const f = await this.file(name); return f ? f.lastModified : 0; },
  async write(name, text) { const w = await (await this.h(name, true)).createWritable(); await w.write(text); await w.close(); },
  async writeBlob(name, blob) { const w = await (await this.h(name, true)).createWritable(); await w.write(blob); await w.close(); },
  async save(name, obj) { return this.write(name, JSON.stringify(obj)); },
  async append(name, text, header, handle) {

};

/* ---------- Estado ---------- */
const S = { logos: {}, user: null, edit: false, lock: null, config: null, usuarios: [], estado: null, inv: { ln: null, baan: null }, cat: null, seg: { tickets: [] }, corridas: [], claves: {}, mods: {}, tab: 'surtido' };
const FILES = { config: 'config.json', usuarios: 'usuarios.json', estado: 'estado.json', cat: 'catalogos.json', seg: 'seguimiento.json', corridas: 'corridas.json', claves: 'claves.json', invln: 'inventario_ln.json', invbaan: 'inventario_baan.json', lock: 'candado.json' };

async function marcarMods() { for (const k of WATCH) S.mods[k] = await FS.mod(FILES[k]); }

/* ---------- Contraseñas ---------- */
async function hash(salt, pass) {
  const data = new TextEncoder().encode(salt + '|' + pass);
  if (crypto.subtle) { const b = await crypto.subtle.digest('SHA-256', data); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }

}

  const salt = Math.random().toString(36).slice(2);
  const u = { id: 'u' + Date.now().toString(36), nombre, usuario, salt, hash: pass ? await hash(salt, pass) : '', rol, activo: true, creado: nowIso() };

}

/* ---------- Candado de edición (un solo editor) ---------- */

/* ---------- Arranque / compuerta ---------- */
const app = () => $('#app');

  const step = Math.ceil(n / 12);
  labels.forEach((l, i) => { if (i % step === 0) g += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="10" fill="${(opt.gris || [])[i] ? '#b6bfcc' : '#475569'}">${esc(l)}</text>`; });
  for (const s of series) {

  <div class="card"><h3>Productividad por línea y turno</h3><div class="tw"><table class="t"><tr><th>Línea</th><th>Turno</th><th class="n">Impresos</th><th class="n">Cerrados</th><th class="n">En cero</th><th style="width:30%">% Cerrado</th><th class="n">Tickets/h</th><th class="n">Meta t/h</th></tr>
  ${ord.map(k => { const [g, t] = k.split('|'), x = cuenta(grp[k]), cu = pct(x.conf + x.cero, x.n), tt = turnoPorId(t), th = (x.conf + x.cero) / QS.horasTurno(tt) / dias.length, sinMeta = dias.every(d => clase(d, t)); const col = sinMeta ? '' : cu >= M.cumplimiento ? 'g' : cu >= M.cumplimiento - 15 ? 'o' : 'r'; return `<tr ${drK('p' + k, g + ' · ' + tt.nombre, grp[k])}><td class="b">${esc(g)}</td><td>${esc(tt.nombre)}</td><td class="n">${x.n}</td><td class="n">${x.conf + x.cero}</td><td class="n">${x.cero}</td><td><div class="row" style="flex-wrap:nowrap"><b style="width:42px">${cu}%</b><div class="bar grow"><i class="${col}" style="width:${cu}%"></i></div>${sinMeta ? '<span class="tag k">sin meta</span>' : ''}</div></td><td class="n b">${nf(Math.round(th * 10) / 10)}</td><td class="n mut">${sinMeta ? '—' : M.ticketsHora[t] || '—'}</td></tr>`; }).join('') || '<tr><td colspan="8" class="mut" style="padding:18px;text-align:center">Sin tickets en el periodo.</td></tr>'}</table></div><p class="sm mut">La meta de tickets por hora se define por turno en Configuración y aplica a toda la operación. Los turnos no laborables y festivos no suman meta.</p></div>`;
}

  <div class="row" style="margin-top:10px"><input type="date" id="fe-f" ${e}><input id="fe-n" placeholder="Nombre" ${e}><label><input type="checkbox" id="fe-l" ${e}> Se trabaja</label><button class="btn" data-a="festAdd" ${e}>Agregar</button></div></div>

  <div class="row" style="margin-top:10px"><input type="date" id="nl-f" ${e}><select id="nl-t" ${e}><option value="*">Todos los turnos</option>${c.turnos.map(t => `<option value="${t.id}">${esc(t.nombre)}</option>`).join('')}</select><button class="btn" data-a="nlAdd" ${e}>Agregar</button></div></div></div>

const soloAdmin = () => { if (!esAdmin()) throw new Error('Solo el administrador.'); };
ACT.cfgSave = async () => {
  soloAdmin(); const c = S.config;
  c.turnos.forEach((t, i) => { t.nombre = QS.norm($('#tn' + i).value) || t.nombre; t.inicio = $('#ti' + i).value || t.inicio; t.fin = $('#tf' + i).value || t.fin; c.metas.ticketsHora[t.id] = +$('#m-th' + t.id).value || 0; });
  c.metas.cumplimiento = +$('#m-cu').value || 0; c.renglonesHoja = Math.min(27, Math.max(5, +$('#m-rh').value || 25)); c.notaDif = $('#m-nd').checked;
  const g = {}; for (const l of $('#g-map').value.split('\n')) { const [a, b] = l.split('='); if (QS.norm(a) && QS.norm(b)) g[QS.norm(a).toUpperCase()] = QS.norm(b).toUpperCase(); } c.grupos = g;
  c.grupoOrden = $('#g-ord').value.split(',').map(x => QS.norm(x).toUpperCase()).filter(Boolean);
  const s = {}; document.querySelectorAll('input.nl:checked').forEach(x => (s[x.dataset.d] = s[x.dataset.d] || []).push(x.dataset.t)); c.noLab.semanal = s;
  await guardar('config'); await evento('CONFIGURACION', 'Turnos, metas, líneas'); render(); toast('Configuración guardada.');
};
ACT.festAdd = async () => { soloAdmin(); const f = $('#fe-f').value; if (!f) throw new Error('Elige la fecha.'); S.config.festivos = S.config.festivos.filter(x => x.fecha !== f).concat({ fecha: f, nombre: QS.norm($('#fe-n').value) || 'Festivo', laborable: $('#fe-l').checked }); await guardar('config'); renderTab(); };
ACT.festDel = async el => { soloAdmin(); S.config.festivos = S.config.festivos.filter(x => x.fecha !== el.dataset.f); await guardar('config'); renderTab(); };
ACT.nlAdd = async () => { soloAdmin(); const f = $('#nl-f').value; if (!f) throw new Error('Elige la fecha.'); S.config.noLab.fechas.push({ fecha: f, turno: $('#nl-t').value }); await guardar('config'); renderTab(); };
ACT.nlDel = async el => { soloAdmin(); S.config.noLab.fechas.splice(+el.dataset.i3, 1); await guardar('config'); renderTab(); };
const usr = id => S.usuarios.find(u => u.id === id);
const quedaAdmin = () => { if (!S.usuarios.some(u => u.rol === 'administrador' && u.activo !== false)) throw new Error('Debe quedar al menos un administrador activo.'); };
CHG.usrRol = async el => { soloAdmin(); const u = usr(el.dataset.u), ant = u.rol; u.rol = el.value; try { quedaAdmin(); if (u.rol !== 'montacarguista' && !u.hash) throw new Error('Asígnale una contraseña antes de darle ese rol.'); } catch (e) { u.rol = ant; renderTab(); throw e; } await guardar('usuarios'); await evento('USUARIO_ROL', u.usuario + ' → ' + u.rol); renderTab(); };
ACT.usrAct = async el => { soloAdmin(); const u = usr(el.dataset.u); u.activo = u.activo === false; try { quedaAdmin(); } catch (e) { u.activo = true; throw e; } await guardar('usuarios'); renderTab(); };
ACT.usrPw = async el => { soloAdmin(); const u = usr(el.dataset.u), p = await dlg({ titulo: 'Cambiar contraseña', msg: 'Nueva contraseña para ' + u.nombre + ' (mínimo 4 caracteres).', input: 'password', ok: 'Guardar' }); if (p == null) return; if (p.length < 4) throw new Error('Mínimo 4 caracteres.'); u.salt = Math.random().toString(36).slice(2); u.hash = await hash(u.salt, p); await guardar('usuarios'); await evento('USUARIO_PASS', u.usuario); toast('Contraseña actualizada.'); };
ACT.usrAdd = async () => { soloAdmin(); const u = await crearUsuario({ nombre: $('#u-nom').value, usuario: $('#u-usr').value, pass: $('#u-pw').value, rol: $('#u-rol').value }); try { await guardar('usuarios'); } catch (e) { S.usuarios.pop(); throw e; } await evento('USUARIO_ALTA', u.usuario + ' (' + u.rol + ')'); renderTab(); toast('Usuario agregado.'); };
ACT.fmtSave = async () => { soloAdmin(); S.config.formato = QS.norm($('#hs-fmt').value); await guardar('config'); await evento('CONFIGURACION', 'Formato de hoja: ' + S.config.formato); renderTab(); toast('Número de formato guardado.'); };
CHG.logoHoja = async el => { soloAdmin(); if (!S.edit) throw new Error('Estás en modo lectura.'); const f = el.files[0], k = el.dataset.k; if (!f) return; const ext = (f.name.split('.').pop() || '').toLowerCase(); if (!LOGO_EXT.includes(ext)) throw new Error('Usa PNG, JPG o SVG.'); if (f.size > 1024 * 1024) throw new Error('La imagen pesa más de 1 MB.');
  for (const x of LOGO_EXT) { try { await FS.dir.removeEntry('logo_' + k + '.' + x); } catch (err) { } }
  await FS.writeBlob('logo_' + k + '.' + ext, f); S.logos[k] = await leerLogo(k); await evento('CONFIGURACION', 'Logo de hoja: ' + k); renderTab(); toast('Logo guardado en la carpeta como logo_' + k + '.' + ext); };
CHG.logoFile = async el => { soloAdmin(); const f = el.files[0]; if (!f) return; if (f.size > 400 * 1024) throw new Error('La imagen pesa más de 400 KB.'); const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(f); }); S.config.logo = url; await guardar('config'); await evento('CONFIGURACION', 'Logo actualizado'); render(); toast('Logo actualizado.'); };
ACT.logoDel = async () => { soloAdmin(); delete S.config.logo; await guardar('config'); render(); };
ACT.audSel = async () => { soloAdmin(); try { const h = await window.showSaveFilePicker({ suggestedName: 'auditoria_cierres_cero.txt', types: [{ description: 'Texto', accept: { 'text/plain': ['.txt'] } }] }); await IDB.set('audit', h); renderTab(); toast('Archivo de auditoría externo configurado.'); } catch (e) { if (e.name !== 'AbortError') throw e; } };
ACT.audDel = async () => { soloAdmin(); await IDB.del('audit'); renderTab(); };

boot();
